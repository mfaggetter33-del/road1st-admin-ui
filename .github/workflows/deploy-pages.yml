name: Deploy ROAD 1ST Admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: road1st-admin-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check portal language packs and safe selectors
        run: |
          node --check portal-translations.js
          node --check portal-explanations.js
          node --check portal-i18n.js
          node check-portal-locales.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble public portal only
        run: |
          set -euo pipefail
          mkdir -p _site
          for file in \
            index.html owner.html apply.html \
            road1st-logo.svg manifest.webmanifest owner.webmanifest \
            portal-translations.js portal-explanations.js \
            portal-report-translations.js portal-messages.js \
            portal-event-locales.js portal-generated-report-locales.js \
            portal-timeline-locales.js portal-i18n.js \
            fleet-report-print.js; do
            test -s "$file"
            cp -- "$file" "_site/$file"
          done
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 14
          test ! -e _site/docs
          test ! -e _site/backend
          test ! -e _site/.github
          echo "ROAD 1ST portal: 14 approved site assets only; no internal docs or source directories."
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
