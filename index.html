<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e14">
<meta name="application-name" content="ROAD 1ST Fleet">
<meta name="apple-mobile-web-app-title" content="ROAD 1ST Fleet">
<link rel="icon" type="image/svg+xml" href="road1st-logo.svg">
<link rel="shortcut icon" href="road1st-logo.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>ROAD 1ST Admin</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e14;
  --surface:#111822;
  --surface-alt:#171f2b;
  --border:#2b3646;
  --text:#f6f8fb;
  --muted:#9ea9b8;
  --purple:#7c3aed;
  --purple-dark:#5b21b6;
  --teal:#2dd4bf;
  --warning:#f59e0b;
  --danger:#ef4444;
  --success:#22c55e;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 0%,rgba(124,58,237,.15),transparent 30rem),
    radial-gradient(circle at 100% 12%,rgba(45,212,191,.08),transparent 31rem),
    var(--bg);
  color:var(--text);
  font-family:Segoe UI,Arial,sans-serif;
}
.wrap{max-width:1180px;margin:auto;padding:26px 20px 52px}
.brand-shell{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:linear-gradient(145deg,rgba(23,31,43,.97),rgba(17,24,34,.97));
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px 20px;
  margin-bottom:26px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.brand{display:flex;gap:15px;align-items:center;margin:0}
.brand-logo{
  width:70px;
  height:70px;
  border-radius:16px;
  object-fit:contain;
  background:#080b10;
  border:1px solid var(--border);
  box-shadow:0 8px 24px rgba(0,0,0,.34);
}
h1{font-size:28px;margin:0;letter-spacing:.035em}
.brand-tag{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:5px}
.sub,.status{color:var(--muted);font-size:13px}
.brand-status{color:var(--muted);font-size:12px;text-align:right}
.brand-status strong{display:block;color:var(--text);font-size:13px;margin-bottom:4px}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:0 14px 42px rgba(0,0,0,.24);
}
.login{max-width:460px;margin:52px auto}
.login h2{font-size:25px;margin:0 0 10px}
label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:17px 0 7px;
}
input{
  width:100%;
  padding:14px 15px;
  background:#0d131c;
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  font-size:15px;
  outline:none;
}
input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(45,212,191,.12);
}
button{
  border:1px solid var(--purple-dark);
  border-radius:16px;
  padding:13px 16px;
  font-weight:800;
  background:var(--purple);
  color:var(--text);
  cursor:pointer;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:default;transform:none}
.secondary{
  background:var(--surface-alt);
  border-color:var(--border);
  color:var(--text);
}
.teal{
  background:var(--teal);
  border-color:var(--teal);
  color:var(--bg);
}
.full{width:100%;margin-top:12px}
.hidden{display:none!important}
.error{color:var(--danger);min-height:20px;margin-top:12px;font-size:13px;line-height:1.45}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.toolbar strong{font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}
.stat{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px 18px;
  cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.18);
}
.stat:hover{border-color:#3b4b61}
.stat.active{
  background:linear-gradient(145deg,rgba(124,58,237,.17),rgba(17,24,34,1));
  border-color:var(--teal);
  box-shadow:inset 0 0 0 1px rgba(45,212,191,.12),0 10px 28px rgba(0,0,0,.22);
}
.stat b{font-size:27px;color:var(--text)}
.stat.active b{color:var(--teal)}
.table{
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 14px 38px rgba(0,0,0,.2);
}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:12px 13px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}
th{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
  background:var(--surface-alt);
}
tr:last-child td{border-bottom:0}
.dl{
  background:var(--teal);
  border-color:var(--teal);
  color:var(--bg);
  padding:8px 11px;
  font-size:12px;
  border-radius:12px;
}
.status{padding:9px 2px}
.right{display:flex;gap:8px}
.switch{margin-top:17px;text-align:center}
.switch button{
  background:var(--surface-alt);
  border:1px solid var(--border);
  font-weight:700;
  border-radius:14px;
}
.note{margin-top:13px;color:var(--muted);font-size:12px;line-height:1.5}

.viewbtn{
  background:var(--purple);
  border-color:var(--purple-dark);
  color:var(--text);
  padding:8px 12px;
  font-size:12px;
  border-radius:12px;
}
.viewer-backdrop{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(3,6,10,.86);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:28px 14px;
  overflow:auto;
}
.viewer{
  width:min(1080px,100%);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:0 28px 90px rgba(0,0,0,.65);
  overflow:hidden;
}
.viewer-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:18px 20px;
  background:rgba(17,24,34,.97);
  border-bottom:1px solid var(--border);
}
.viewer-head h2{margin:0;font-size:23px}
.viewer-body{padding:20px}
.viewer-actions{display:flex;gap:8px;flex-wrap:wrap}
.viewer-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}
.viewer-kpi{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
}
.viewer-kpi b{display:block;font-size:23px;color:var(--teal);margin-bottom:4px}
.viewer-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-top:14px;
}
.viewer-section h3{margin:0 0 13px;font-size:17px}
.viewer-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px 18px;
}
.viewer-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid rgba(43,54,70,.65);
}
.viewer-row:last-child{border-bottom:0}
.viewer-row span:first-child{color:var(--muted)}
.viewer-row strong{text-align:right;font-weight:700}
.viewer-ok{color:var(--success)}
.viewer-warn{color:var(--warning)}
.timeline{display:flex;flex-direction:column;gap:9px}
.timeline-item{
  display:grid;
  grid-template-columns:170px 190px minmax(0,1fr);
  gap:12px;
  align-items:start;
  padding:11px 12px;
  background:var(--surface-alt);
  border:1px solid var(--border);
  border-radius:13px;
}
.timeline-time{color:var(--muted);font-size:12px}
.timeline-event{font-weight:800;color:var(--teal);font-size:12px}
.timeline-detail{font-size:13px;line-height:1.4}
.viewer-empty{color:var(--muted);padding:6px 0}
.viewer-loading{padding:35px 20px;color:var(--muted);text-align:center}
@media(max-width:720px){
  .wrap{padding:14px 12px 38px}
  .brand-shell{align-items:flex-start;flex-direction:column}
  .brand-status{text-align:left}
  .brand-logo{width:58px;height:58px}
  .stats{grid-template-columns:1fr}
  .toolbar{align-items:flex-start;flex-direction:column}
  .viewer-summary{grid-template-columns:1fr 1fr}
  .viewer-grid{grid-template-columns:1fr}
  .timeline-item{grid-template-columns:1fr;gap:4px}
}
</style>
</head>

function date(v){try{return new Date(v).toLocaleString()}catch(e){return v||"—"}}function bytes(v){var n=Number(v||0);return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
function cell(tr,v){var x=document.createElement("td");x.textContent=v==null||v===""?"—":String(v);tr.appendChild(x)}function headers(a){head.textContent="";var tr=document.createElement("tr");a.forEach(function(v){var th=document.createElement("th");th.textContent=v;tr.appendChild(th)});head.appendChild(tr)}
async function downloadFile(k,id){var d=await api(A,{method:"POST",body:JSON.stringify({action:"download",kind:k,id:id})}),a=document.createElement("a");a.href=d.url;a.download=d.filename||"";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
function dl(tr,k,id){var td=document.createElement("td"),b=document.createElement("button");b.className="dl";b.textContent="Download";b.onclick=async function(){b.disabled=true;try{await downloadFile(k,id)}catch(e){status.textContent=e.message}finally{b.disabled=false}};td.appendChild(b);tr.appendChild(td)}
function duration(v){var n=Number(v);if(!Number.isFinite(n)||n<0)return "—";var h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=Math.floor(n%60);return h?h+"h "+m+"m":m?m+"m "+s+"s":s+"s"}
function words(v){return String(v==null?"":v).replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()})}
function eventName(e){var m={session_start:"Journey started",session_end:"Journey ended",driving_activated:"Driving Mode activated",bluetooth_changed:"Bluetooth",trip_control:"Journey control",gps_disabled:"GPS disabled",gps_enabled:"GPS enabled",gps_quality_changed:"GPS quality",gps_monitoring_changed:"GPS monitoring",cloud_checkpoint:"Cloud checkpoint",cloud_checkpoint_failed:"Cloud checkpoint failed",crew_event:"Crew event",setup_wizard_start:"Setup wizard started",setup_wizard_end:"Setup wizard ended",setup_step_action:"Setup step",setup_step_result:"Setup step result"};return m[e]||words(e)}
function controlName(v){var m={temporary_stop:"Temporary Stop",police_stop:"Police Stop",emergency_breakdown:"Emergency / Breakdown",other_work:"Other Work",break_rest:"Break / Rest",resume_protection:"Resume Protection",auto_resume_on_movement:"Automatic resume on movement"};return m[v]||words(v)}
function eventDetail(r){if(!r)return "";switch(r.event){case"session_start":return [words(r.vehicle_type),r.journey_mode,r.start_mode].filter(Boolean).join(" • ");case"session_end":return "Reason: "+words(r.reason||"ended");case"driving_activated":return words(r.reason||"movement detected");case"bluetooth_changed":return "Vehicle Bluetooth: "+words(r.state);case"trip_control":var d=controlName(r.control);if(r.duration_minutes)d+=" • "+r.duration_minutes+" min";if(r.resumed_from)d+=" • from "+controlName(r.resumed_from);return d;case"gps_quality_changed":return "Quality: "+words(r.quality);case"gps_monitoring_changed":return "State: "+words(r.state);case"cloud_checkpoint":return "Saved while journey active • "+words(r.reason);case"cloud_checkpoint_failed":return "Error: "+(r.error||"checkpoint failed");case"crew_event":return [controlName(r.control),r.detail].filter(Boolean).join(" • ");case"setup_step_action":case"setup_step_result":return [words(r.step),words(r.result||r.detail)].filter(Boolean).join(" • ");case"setup_wizard_start":case"setup_wizard_end":return words(r.result||r.step||"");default:var bits=[];["state","quality","control","reason","detail","result"].forEach(function(k){if(r[k]!=null&&r[k]!=="")bits.push(words(r[k]))});return bits.join(" • ")}}
function addKpi(parent,label,value){var x=document.createElement("div"),b=document.createElement("b"),s=document.createElement("div");x.className="viewer-kpi";b.textContent=value;s.className="sub";s.textContent=label;x.appendChild(b);x.appendChild(s);parent.appendChild(x)}
function addRow(parent,label,value){var x=document.createElement("div"),a=document.createElement("span"),b=document.createElement("strong");x.className="viewer-row";a.textContent=label;b.textContent=value==null||value===""?"—":String(value);x.appendChild(a);x.appendChild(b);parent.appendChild(x)}
function section(title){var x=document.createElement("section"),h=document.createElement("h3");x.className="viewer-section";h.textContent=title;x.appendChild(h);viewerContent.appendChild(x);return x}
function closeViewer(){viewer.classList.add("hidden");viewerContent.textContent="";viewerDownload.onclick=null}
function showReport(d,id){var r=d.report||{};viewerContent.textContent="";viewerTitle.textContent=r.report_type==="setup_wizard"?"ROAD 1ST Setup Report":"ROAD 1ST Journey Report";viewerFile.textContent=d.filename||"";viewerDownload.onclick=function(){downloadFile("reports",id).catch(function(e){status.textContent=e.message})};
var sum=document.createElement("div");sum.className="viewer-summary";addKpi(sum,"Duration",duration(r.duration_seconds));addKpi(sum,"Maximum speed",r.max_speed_kmh==null?"—":r.max_speed_kmh+" km/h");addKpi(sum,"Driving Mode",r.driving_activations?("Activated "+r.driving_activations+"×"):"Not activated");addKpi(sum,"GPS usable",r.gps_samples?(r.usable_gps_samples+" / "+r.gps_samples):"—");viewerContent.appendChild(sum);
var details=section("Journey summary"),grid=document.createElement("div");grid.className="viewer-grid";addRow(grid,"Started",date(r.start_utc));addRow(grid,"Finished",date(r.end_utc));addRow(grid,"App version",r.version);addRow(grid,"Vehicle",words(r.vehicle_type));addRow(grid,"Journey mode",r.journey_mode);addRow(grid,"Start mode",words(r.start_mode));addRow(grid,"End reason",words(r.end_reason));addRow(grid,"Automatic resumes",r.auto_resumes);addRow(grid,"Bluetooth connected events",r.bluetooth_connected_events);addRow(grid,"Bluetooth disconnected events",r.bluetooth_disconnected_events);addRow(grid,"Cloud checkpoints",r.checkpoints);addRow(grid,"Blocked apps",r.blocked_app_count);details.appendChild(grid);
var controls=r.controls||{},keys=Object.keys(controls).filter(function(k){return k!=="auto_resume_on_movement"});if(keys.length){var cs=section("Stops, breaks and controls");keys.forEach(function(k){addRow(cs,controlName(k),controls[k]+" recorded")})}
var issues=section("Warnings / errors");if(r.issues&&r.issues.length){r.issues.forEach(function(x){var row=document.createElement("div");row.className="viewer-row";var a=document.createElement("span"),b=document.createElement("strong");a.textContent=date(x.utc);b.textContent=eventName(x.event)+": "+x.detail;b.className="viewer-warn";row.appendChild(a);row.appendChild(b);issues.appendChild(row)})}else{var ok=document.createElement("div");ok.className="viewer-empty viewer-ok";ok.textContent="No recorded failures or GPS-disable events.";issues.appendChild(ok)}
var ts=section("Event timeline"),list=document.createElement("div");list.className="timeline";(r.timeline||[]).forEach(function(x){var item=document.createElement("div"),t=document.createElement("div"),e=document.createElement("div"),dd=document.createElement("div");item.className="timeline-item";t.className="timeline-time";e.className="timeline-event";dd.className="timeline-detail";t.textContent=date(x.utc);e.textContent=eventName(x.event);dd.textContent=eventDetail(x);item.appendChild(t);item.appendChild(e);item.appendChild(dd);list.appendChild(item)});if(!(r.timeline||[]).length){var empty=document.createElement("div");empty.className="viewer-empty";empty.textContent="No timeline events available.";list.appendChild(empty)}ts.appendChild(list)}
function viewBtn(tr,id,filename){var td=document.createElement("td"),b=document.createElement("button");b.className="viewbtn";b.textContent="View report";b.onclick=async function(){viewer.classList.remove("hidden");viewerTitle.textContent="ROAD 1ST Report";viewerFile.textContent=filename||"";viewerContent.textContent="";viewerLoading.classList.remove("hidden");b.disabled=true;try{var d=await api(A,{method:"POST",body:JSON.stringify({action:"view",kind:"reports",id:id})});showReport(d,id)}catch(e){viewerContent.textContent="Could not read this report: "+(e.message||"Unknown error")}finally{viewerLoading.classList.add("hidden");b.disabled=false}};td.appendChild(b);tr.appendChild(td)}
function render(k,items){body.textContent="";if(k==="reports"){headers(["Received","App","File","Lines","Size","View","Download"]);items.forEach(function(x){var tr=document.createElement("tr");cell(tr,date(x.created_at));cell(tr,x.app_version);cell(tr,x.original_filename);cell(tr,x.content_line_count);cell(tr,bytes(x.size_bytes));viewBtn(tr,x.id,x.original_filename);dl(tr,"reports",x.id);body.appendChild(tr)})}else if(k==="fuel"){headers(["Received","Registration","Odometer","Litres","App","Download"]);items.forEach(function(x){var tr=document.createElement("tr");cell(tr,date(x.created_at));cell(tr,x.registration);cell(tr,x.odometer);cell(tr,x.litres);cell(tr,x.app_version);dl(tr,"fuel",x.id);body.appendChild(tr)})}else{headers(["Received","Registration","Vehicle","Section","Defect","Download"]);items.forEach(function(x){var tr=document.createElement("tr");cell(tr,date(x.created_at));cell(tr,x.registration);cell(tr,x.vehicle_type);cell(tr,x.section);cell(tr,x.defect_label);dl(tr,"defects",x.id);body.appendChild(tr)})}}
async function load(k){C=k;status.textContent="Loading…";document.querySelectorAll(".stat").forEach(function(x){x.classList.toggle("active",x.dataset.kind===k)});document.getElementById("title").textContent=k==="reports"?"Reports":k==="fuel"?"Fuel receipts":"Defect photos";var d=await api(A+"?kind="+k+"&limit=50");render(k,d.items||[]);document.getElementById(k+"Count").textContent=d.total;status.textContent="Showing newest "+(d.items||[]).length+" of "+d.total+"."}
async function counts(){await Promise.all(["reports","fuel","defects"].map(async function(k){try{var d=await api(A+"?kind="+k+"&limit=1");document.getElementById(k+"Count").textContent=d.total}catch(e){}}))}
async function show(){login.classList.add("hidden");dash.classList.remove("hidden");try{await load(C);await counts()}catch(e){status.textContent=e.message;if((e.message||"").indexOf("approved")>=0){clear();dash.classList.add("hidden");login.classList.remove("hidden");err.textContent=e.message}}}
document.getElementById("viewerClose").onclick=closeViewer;viewer.onclick=function(e){if(e.target===viewer)closeViewer()};document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!viewer.classList.contains("hidden"))closeViewer()});document.getElementById("loginBtn").onclick=signin;document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")signin()});document.getElementById("logout").onclick=function(){clear();location.reload()};document.getElementById("refresh").onclick=function(){load(C).then(counts).catch(function(){})};document.querySelectorAll(".stat").forEach(function(x){x.onclick=function(){load(x.dataset.kind).catch(function(e){status.textContent=e.message})}});if(S)show();
})();
