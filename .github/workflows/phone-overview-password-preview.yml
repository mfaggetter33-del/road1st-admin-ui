name: ROAD 1ST phone overview and account password review
on:
  push:
    branches:
      - security/mobile-readonly-and-password-policy-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check read-only phone overview and password requirements
        run: |
          node --check password-policy.js
          node checks/verify_mobile_preview.cjs
          git diff --check
